plugins {
	id 'multimodule-config'
	id 'spring-conventions'
	id 'spring-cache-conventions'
	id 'spring-web-conventions'
	id 'spring-feign-conventions'
	id 'micrometer-conventions'
	id 'loki-conventions'
	id 'protobuf-conventions'
	id 'lombok-conventions'
}

// version comes from root project
group = 'ru.dankoy.kafkamessageproducer'

repositories {
	maven {
		url "https://packages.confluent.io/maven"
	}
}

dependencies {

	// eureka for service discovery
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// integration with kafka
	//    implementation 'org.springframework.boot:spring-boot-starter-integration'
	//    implementation 'org.springframework.integration:spring-integration-kafka'
	// implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// protobuf schemas
	implementation project(":protobuf_schemas")
	implementation ("io.confluent:kafka-protobuf-serializer:8.3.1")
	// {
	// 	exclude group: "com.google.protobuf", module: "protobuf-java"
	// 	exclude group: "com.google.protobuf", module: "protobuf-java-util"
	// }

    // Create a platform that enforces the version
    implementation platform('com.google.api.grpc:proto-google-common-protos:2.75.0')

	// implementation 'com.google.protobuf:protobuf-java-util:4.30.1'

	testImplementation 'org.testcontainers:testcontainers-kafka'
}


