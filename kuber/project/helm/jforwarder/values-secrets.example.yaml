# Example of a private values file with the real secret values.
#
#   cp values-secrets.example.yaml values-secrets.yaml   # keep it out of git
#   helm upgrade --install jforwarder ./jforwarder -n jforwarder \
#     -f values-secrets.yaml --set image.user=<docker user> --set image.tag=<tag>
#
# The alternative is `--set secrets.create=false` and managing the secrets
# outside of the chart (this is what kuber/secrets.sh does today).
secrets:
  create: true
  data:
    telegram-bot-secret:
      TELEGRAM_BOT_NAME: real_bot_name
      TELEGRAM_BOT_API_TOKEN: real_token

    subscriptions-holder-secret:
      POSTGRES_CONTAINER_URL: jdbc:postgresql://subscriptions-holder-postgres-db:5432/db
      POSTGRES_CONTAINER_USER: real_user
      POSTGRES_CONTAINER_PASSWORD: real_password
      JASYPT_MASTER_PASSWORD: real_master_password
      SUBSCRIPTIONS_HOLDER_SERVICE_JASYPT_PARAMS: |
        -Djasypt.encryptor.password=${JASYPT_MASTER_PASSWORD}
        -Djasypt.encryptor.algorithm=PBEWithMD5AndDES
        -Djasypt.encryptor.ivGeneratorClassName=org.jasypt.iv.NoIvGenerator

    telegram-chat-service-secret:
      TELEGRAM_CHAT_SERVICE_POSTGRES_CONTAINER_URL: jdbc:postgresql://telegram-chat-service-postgres-db:5432/db
      TELEGRAM_CHAT_SERVICE_POSTGRES_CONTAINER_USER: real_user
      TELEGRAM_CHAT_SERVICE_POSTGRES_CONTAINER_PASSWORD: real_password
      TELEGRAM_CHAT_SERVICE_POSTGRES_CONTAINER_DB: real_db
      TELEGRAM_CHAT_SERVICE_JASYPT_MASTER_PASSWORD: real_master_password
      TELEGRAM_CHAT_SERVICE_JASYPT_PARAMS: |
        -Djasypt.encryptor.password=${TELEGRAM_CHAT_SERVICE_JASYPT_MASTER_PASSWORD}
        -Djasypt.encryptor.algorithm=PBEWithMD5AndDES
        -Djasypt.encryptor.ivGeneratorClassName=org.jasypt.iv.NoIvGenerator

    subscriptions-holder-db-secret:
      PGUSER: real_user
      POSTGRES_USER: real_user
      POSTGRES_PASSWORD: real_password
      POSTGRES_DB: real_db

    telegram-chat-service-db-secret:
      PGUSER: real_user
      POSTGRES_USER: real_user
      POSTGRES_PASSWORD: real_password
      POSTGRES_DB: real_db
