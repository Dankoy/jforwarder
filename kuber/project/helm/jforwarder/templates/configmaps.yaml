{{- if .Values.defaultConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.defaultConfig.name }}
  labels:
    {{- include "jforwarder.componentLabels" (dict "root" $ "component" "shared-config") | nindent 4 }}
data:
  {{- toYaml .Values.defaultConfig.data | nindent 2 }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    app: {{ $name }}
    {{- include "jforwarder.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
data:
  {{- include "jforwarder.serviceConfigData" (dict "root" $ "svc" $svc) | nindent 2 }}
{{- end }}
{{- end }}
