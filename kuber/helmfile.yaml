---
# Infrastructure of the cluster: every chart that is installed with helm and is
# not the application itself. The application is deployed with kustomize, see
# project/kustomize.
#
#   helmfile diff                              # what would change
#   helmfile apply                             # everything
#   helmfile -l name=strimzi-cluster-operator apply   # one release
#
# Chart versions are pinned here on purpose. An unpinned install takes whatever
# is latest on the day it runs, which is how the kafka manifests ended up two
# API versions behind the operator (#356).
#
# Pinning is meant to keep a deploy from changing anything by itself. Raising a
# version is a separate, deliberate commit, and for a chart that carries CRDs it
# is two steps, because helm never updates CRDs on upgrade - see "Charts" in
# ./README.md.
#
# These pins are ahead of what the cluster runs and need work before an apply:
#
#   strimzi 1.2.0 against the installed 0.47.0 - came with #356, needs the v1
#   API migration written down in ./README.md;
#
#   loki 7.3.0, fluent-operator 4.3.0 and kube-prometheus-stack 90.0.0 - all
#   three change their CRDs, so the CRDs go in by hand before the sync;
#
#   mimir 6.2.0 against the installed 5.8.0 - the biggest of them. 6.x moves to
#   the ingest-storage architecture, where the distributor writes to a kafka of
#   the chart's own and the ingesters no longer take a direct gRPC push, and it
#   renames the mimir-nginx service to mimir-gateway. Both mimir URLs in
#   monitoring/kubestack-values.yaml follow that rename in this commit, and
#   monitoring/mimir/values.yaml sizes the new kafka. Read the mimir section of
#   ./README.md before applying it.

repositories:
  - name: strimzi
    url: https://strimzi.io/charts/
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: fluent
    url: https://fluent.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: minio-operator
    url: https://operator.min.io
  - name: headlamp
    url: https://kubernetes-sigs.github.io/headlamp/

releases:
  ## kafka ####################################################################

  - name: strimzi-cluster-operator
    namespace: kafka
    chart: strimzi/strimzi-kafka-operator
    version: 1.2.0
    values:
      - kafka/strizmi-kafka/strizmi-values.yaml

  ## object storage for mimir #################################################

  - name: operator
    namespace: minio-operator
    chart: minio-operator/operator
    version: 7.1.1
    values:
      - monitoring/minio/operator-values.yaml
    # The tenant below is an object of the CRD this release brings, and it is
    # installed right after it: without waiting for the operator to be ready
    # helm cannot map the Tenant kind yet. This is what the "sleep 30" of the
    # old minio.sh was for. Only the releases someone waits for get this, a
    # global wait would block on mimir, which cannot become ready until its
    # real secret is in the cluster.
    wait: true
    timeout: 600

  - name: minio
    namespace: minio
    chart: minio-operator/tenant
    version: 7.1.1
    values:
      - monitoring/minio/tenant-values.yaml
    # an object of the CRD the operator release brings, so it goes after it
    needs:
      - minio-operator/operator

  ## monitoring ###############################################################

  - name: mimir
    namespace: mimir
    chart: grafana/mimir-distributed
    version: 6.2.0
    values:
      - monitoring/mimir/values.yaml
    # mimir stores its blocks in the tenant
    needs:
      - minio/minio

  - name: loki
    namespace: monitoring
    chart: grafana/loki
    version: 7.3.0
    values:
      - monitoring/loki/values.yaml
    # loki keeps its chunks and its index in the tenant as well. Without it the
    # pods still start and even report ready, they just fail every S3 call.
    needs:
      - minio/minio

  - name: fluent-operator
    namespace: fluent
    chart: fluent/fluent-operator
    version: 4.3.0
    values:
      - monitoring/fluent-bit/fluent-operator.yaml

  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 90.0.0
    values:
      - monitoring/kubestack-values.yaml

  ## cluster ui ###############################################################

  # Headlamp, the cluster UI, in place of kubernetes-dashboard. The dashboard
  # was archived by upstream as kubernetes-retired/dashboard for lack of
  # maintainers, and its own README sends users here; headlamp is maintained
  # under sig-ui. The dashboard's last chart, 7.14.0, is still downloadable
  # from the retired repository, but nothing will be fixed in it again.
  #
  # The cluster may still run the old release. It is not in this file any more,
  # so helmfile leaves it alone rather than removing it - uninstall it by hand,
  # see "Cluster UI" in ./README.md.
  - name: headlamp
    namespace: headlamp
    chart: headlamp/headlamp
    version: 0.45.0
    values:
      - headlamp/values.yaml
