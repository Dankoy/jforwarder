alertmanager:
  enabled: true
  alertmanagerSpec:
  ## AlertmanagerConfigs to be selected to merge and configure Alertmanager with.
  ##
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: alertmanager-telegram # it is the same label in the AlertmanagerConfig.
    alertmanagerConfigMatcherStrategy:
      type: OnNamespace # Make only one AlertmanagerConfig match alerts only from namespaces
      # type: None # Make only one AlertmanagerConfig match all alerts


grafana:
  enabled: true
  admin:
    # Name of the secret. Can be templated.
    existingSecret: "grafana-admin-secret"
    userKey: admin-user
    passwordKey: admin-password

  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true

      name: Prometheus
      uid: prometheus

      timeout: 60

  ## Configure additional grafana datasources (passed through tpl)
  ## ref: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
  additionalDataSources:
  - name: mimir
    access: proxy
    id: mimir
    basicAuth: false
    editable: false
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "jforwarder"
    orgId: 1
    type: prometheus
    url: http://mimir-gateway.mimir:80/prometheus
    version: 1
  - name: Loki
    access: proxy
    id: Loki
    uid: loki
    basicAuth: false
    editable: false
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
      # Turns the trace id printed in every log line into a link to the trace.
      # The id comes from the correlation bracket written by
      # logging.pattern.correlation: [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
      # e.g. ... ERROR 1 --- [pool-2-thread-1] [telegram-bot,6f1a2b,9c22d1] r.d.t.CoubService : msg
      # It is the only bracket on the line that contains commas, so the thread
      # name is skipped, and it is still found once fluent-bit wraps the line in
      # JSON for the loki output. Lines logged outside a trace render as
      # [name,,] and stay unmatched.
      derivedFields:
        # Internal link. datasourceUid must match the uid of the Zipkin datasource below.
        - datasourceUid: zipkin
          matcherRegex: '\[[^,\]]*,([0-9a-f]+),[0-9a-f]*\]'
          name: TraceID
          url: $${__value.raw}
        # External link, through the zipkin ingress host.
        - matcherRegex: '\[[^,\]]*,([0-9a-f]+),[0-9a-f]*\]'
          name: TraceID_External
          url: 'http://zipkin/zipkin/traces/$${__value.raw}'
    secureJsonData:
      httpHeaderValue1: "jforwarder"
    orgId: 1
    type: loki
    url: http://loki-gateway.monitoring
  - name: Zipkin
    access: proxy
    uid: zipkin
    basicAuth: false
    editable: false
    readOnly: true
    orgId: 1
    type: zipkin
    url: http://zipkin.monitoring:9411/
    jsonData:
      tracesToLogsV2:
        # Back link from a span to its logs. Must match the uid of Loki above.
        datasourceUid: 'loki'
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
        tags: ['job', 'instance', 'pod', 'namespace']
        filterByTraceID: false
        filterBySpanID: true
        customQuery: true
        query: '{traceID="$${__span.traceId}"} |= "$${__span.spanId}"'
      tracesToMetrics:
        datasourceUid: 'prometheus'
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
        tags: [{ key: 'service.name', value: 'service' }, { key: 'job' }]
      nodeGraph:
        enabled: true
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      spanBar:
        type: 'None'
    version: 1

  # Flag to mark provisioned data sources for deletion if they are no longer configured.
  # It takes no effect if data sources are already listed in the deleteDatasources section.
  # ref: https://grafana.com/docs/grafana/latest/administration/provisioning/#example-data-source-configuration-file
  prune: false

kubeApiServer:
  enabled: true
  serviceMonitor:
    # 55k of the 124k series this cluster carried were apiserver, etcd and
    # workqueue histogram buckets - 44% of everything scraped, written to
    # mimir's kafka and read back out of it, for panels nothing here draws:
    # no dashboard under monitoring/grafana/dashboards names any of them.
    #
    # Only the buckets go. apiserver_request_total and the _count and _sum of
    # each histogram stay, so request rates and error ratios still work; what
    # is lost is the latency quantiles and heatmaps of the api server dashboard
    # the chart ships.
    #
    # This replaces a narrower rule the chart sets by default, which drops
    # individual `le` values of the same histograms - whole families are
    # dropped here instead, so that rule has nothing left to do.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: '(apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_slo_duration_seconds|etcd_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|workqueue_work_duration_seconds|workqueue_queue_duration_seconds)_bucket'
      - action: drop
        sourceLabels: [__name__]
        regex: '(apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket'

kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    # The cadvisor endpoint keeps an interval of its own, and the chart sets it
    # to 10s - the housekeeping period of cadvisor itself - so this scrape ran
    # six times a minute while everything else ran twice. It was the largest
    # single source of samples in the cluster by a wide margin.
    #
    # 45s, the same as the global one now. Every window over container_* in the
    # rules the chart ships is [5m], so nothing there loses its second sample.
    cAdvisorInterval: 45s

    # cAdvisor is the largest scrape in the cluster - 59443 samples against the
    # apiserver's 49302 - and almost none of it is read. The keep below is the
    # set of container_* metrics named by anything that runs here: the
    # dashboards the chart ships (k8s-resources-*, namespace-by-*, kubelet) and
    # its recording rules and alerts. The three dashboards of our own, under
    # monitoring/grafana/dashboards, name none of them at all.
    #
    # container_memory_swap is named by those rules and is still left out: the
    # chart's own defaults drop it as always zero, so the rules get nothing for
    # it today either, and keeping it would start collecting something new.
    #
    # A keep and not a list of drops, because the useful set is small and known
    # while the noise is not - and because this replaces the chart's own seven
    # default rules either way, a keep leaves nothing of them to carry over.
    #
    # Windows-only names (container_available, container_private_working_set_
    # usage) are left out; so are the per-device container_fs_* and container_
    # blkio_* families, the spec metrics that duplicate kube-state-metrics, and
    # the per-interface network error counters.
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: keep
        regex: 'container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_cache|memory_rss|memory_working_set_bytes|fs_reads_bytes_total|fs_reads_total|fs_writes_bytes_total|fs_writes_total|network_receive_bytes_total|network_receive_packets_total|network_receive_packets_dropped_total|network_transmit_bytes_total|network_transmit_packets_total|network_transmit_packets_dropped_total)'
      # Two of the chart's defaults that the keep above does not replace,
      # because they select on labels rather than on the metric name. Without
      # them the kept families come back with a tail that is dropped today.
      #
      # Series of cgroups that belong to no pod - /system.slice, the kubepods
      # parents, the node's own slices:
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      # Network counters of the CNI interfaces, which is how a host-network
      # container's traffic gets counted twice:
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'

kubeControllerManager:
  enabled: true

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

prometheus:
  enabled: true

  ## Settings affecting prometheusSpec
  ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheusspec
  ##
  prometheusSpec:

    # 45s instead of the 30s prometheus defaults to. Every sample scraped here
    # is written to mimir's kafka and read back out of it by the ingesters, so
    # the interval sets the load of that whole conveyor, not just of prometheus.
    #
    # It is the default for targets only: a ServiceMonitor that names its own
    # interval keeps it, and the ones in monitoring/servicemonitor still say
    # 15s, so the ten application targets are not affected by this.
    scrapeInterval: 45s

    ## The remote_write spec configuration for Prometheus.
    ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#remotewritespec
    remoteWrite:
    - url: http://mimir-gateway.mimir:80/api/v1/push
      headers:
        X-Scope-OrgID: jforwarder

thanosRuler:
  enabled: false