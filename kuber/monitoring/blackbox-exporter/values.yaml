# Явно задаём namespace для всех ресурсов чарта
namespaceOverride: "monitoring"

serviceMonitor:
  enabled: true
  selfMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  defaults:
    module: http_2xx
    labels:
      release: kube-prometheus-stack
    interval: 5m          # ← вот сюда (например, 30 секунд)
    scrapeTimeout: 30s     # ← таймаут опроса, должен быть меньше interval
  targets:
    - name: coub-forwarder-bot
      url: https://t.me/coub_forwarder_bot

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        method: GET
        preferred_ip_protocol: "ip4"
        follow_redirects: false
        valid_status_codes: [] # Defaults to 2xx
