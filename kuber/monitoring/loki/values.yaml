# The ${ACCESS_KEY_ID} and ${SECRET_ACCESS_KEY} further down are expanded by
# loki itself, and only if it is started with -config.expand-env=true and given
# the secret that holds them. Both have to be set on the component that runs,
# which in deploymentMode: SingleBinary is `singleBinary` - the `global` keys
# that used to be commented out here are not picked up by its StatefulSet, so
# they looked right and did nothing. Without this block the config reaches loki
# with those two strings literally and minio answers InvalidAccessKeyId.
singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-secret

# Disable minio storage
minio:
  enabled: false

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: null
      s3forcepathstyle: true
      # No bucketnames here on purpose. Chart 7.x stops writing
      # common.storage.s3.bucketnames as soon as this key is set, and then the
      # index and chunk calls go out with an empty bucket name and minio
      # answers 400. The bucket below under storage.bucketNames.chunks is the
      # one place it is named; loki merges common.storage into this block.
  pattern_ingester:
      enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h # 28 days retention

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      # s3 URL can be used to specify the endpoint, access key, secret key, and bucket name this works well for S3 compatible storages 
      # or are hosting Loki on-premises and want to use S3 as the storage backend. Either use the s3 URL or the individual fields below (AWS endpoint, region, secret).
      # s3: s3://minio:secretpassword@custom_endpoint/bucket_name
      # AWS endpoint URL
      endpoint: https://minio.minio:443
      # AWS region where the S3 bucket is located
      region: null
      # AWS secret access key
      secretAccessKey: ${SECRET_ACCESS_KEY}
      # AWS access key ID
      accessKeyId: ${ACCESS_KEY_ID}
      # AWS signature version (e.g., v2 or v4)
      # signatureVersion: <your-signature-version>
      # Forces the path style for S3 (true/false)
      s3ForcePathStyle: true
      # Allows insecure (HTTP) connections (true/false). false, because the
      # endpoint above is https: loki 3.6 takes "true" literally and speaks
      # plain HTTP to port 443, which minio resets - 3.5 tolerated the
      # contradiction. The self-signed certificate is handled by
      # insecure_skip_verify below, not by this.
      insecure: false
      # HTTP configuration settings
      # This shit makes loki connect to minio as bucket.minio.namespace. 
      # Disable it { } and then loki goes to normal service
      # But there is a problem with tls on 443 port because it is self signed
      http_config:
        # idle_conn_timeout: 90s
        # response_header_timeout: 0s
        insecure_skip_verify: true

    object_store:
      type: s3
      # Optional prefix for storage keys
      storage_prefix: null
      # S3 configuration (when type is "s3")
      s3:
        endpoint: https://minio.minio:443
        # Optional region
        region: null
        # Optional access key
        access_key_id: ${ACCESS_KEY_ID}
        # Optional secret key
        secret_access_key: ${SECRET_ACCESS_KEY}
        # Optional. Enable if using self-signed TLS
        insecure: false
        # Optional server-side encryption configuration
        sse: {}
        # Optional HTTP client configuration
        http:
          insecure_skip_verify: true

  # Neither of these was a key of this chart. The pair that exists is
  # chunksCache / resultsCache at the top level, so loki.memcached read like it
  # turned both caches off and turned off nothing: the results cache has been
  # running all along (resultsCache.enabled defaults to true, see the note by
  # chunksCache below), and the chunk cache was off only because chunksCache
  # said so.
  #
  #  memcached:
  #    chunk_cache:
  #      enabled: false
  #    results_cache:
  #      enabled: false

  # How many split sub-queries the single binary works on at a time. One
  # grafana query is cut into sub-queries of limits_config.split_queries_by_
  # interval - 15m, from the chart's own values - and handed to these workers,
  # so a query over a day is 96 sub-queries drained 4 at a time at the default.
  # They spend most of their time waiting on minio rather than on cpu, which is
  # why doubling them roughly halves the wait. The pod has no resource limits,
  # so there is room for it.
  #
  # This is the knob that parallelises queries here. query_range.parallelise_
  # shardable_queries, the one that looks like it, defaults to true already.
  querier:
    max_concurrent: 8

  # A chunk cache, which this install has never had: every query re-read the
  # same chunks from minio over TLS, and a repeated query - a dashboard
  # refresh, a time range nudged by a minute - paid for all of them again. The
  # results cache does not cover this, it holds computed answers to metric,
  # volume, stats, series and label queries, never the log lines themselves,
  # which is why browsing logs in explore was the slow part while the histogram
  # above them was quick.
  #
  # In-process rather than the chart's chunksCache: a single binary on a single
  # node gains nothing from putting the cache in another pod behind a network
  # hop, and that pod would ask the node for another gigabyte. The 512MB live
  # in loki's own heap.
  #
  # It goes through structuredConfig, which is merged over the generated config,
  # and not as a plain loki.chunk_store_config key: the chart writes that block
  # only inside `if .Values.chunksCache.enabled` and only in its memcached form,
  # so as a top-level key it is silently dropped - `helm template` renders a
  # config with no chunk cache at all and loki starts happily without one.
  structuredConfig:
    chunk_store_config:
      chunk_cache_config:
        embedded_cache:
          enabled: true
          max_size_mb: 512
          # A chunk is immutable once flushed, so nothing can go stale in here
          # and the default hour only throws away entries that are still
          # correct - a query over yesterday would refetch from minio the
          # second time as well. Six hours covers a working day of looking at
          # the same window. It is not a memory setting: what the cache costs
          # is max_size_mb above, and eviction is by least recently used long
          # before the ttl matters.
          ttl: 6h

    # The results cache, in the process as well - the memcached the chart would
    # run for it is off below. It holds the answers to metric queries, keyed by
    # the 15m splits of limits_config.split_queries_by_interval, so a dashboard
    # whose window slides by a minute recomputes one split instead of all of
    # them. cache_results has to be set here too: the chart writes it only
    # alongside its own memcached block.
    #
    # 128MB and not the 512 of the chunk cache above, because this number is
    # spent more than once. cache_index_stats_results, cache_volume_results,
    # cache_series_results and cache_label_results are all true by default in
    # loki 3.6 and take this config when given none of their own, and with an
    # embedded cache each of them builds its *own* LRU of this size rather than
    # sharing one pool the way they shared the memcached. Five caches, so the
    # ceiling is 640MB, reached only if every one of them fills.
    query_range:
      cache_results: true
      results_cache:
        cache:
          default_validity: 12h
          embedded_cache:
            enabled: true
            max_size_mb: 128
            # Spelled out because the embedded cache keeps a ttl of its own,
            # one hour by default, and it is the shorter of the two that an
            # entry actually lives by - default_validity above would have been
            # decorative. 12h is what the memcached this replaces was set to.
            # Nothing invalidates a cached result when the logs behind it
            # change, so this is also how stale an answer can be; the last 10
            # minutes are never cached at all, see
            # limits_config.max_cache_freshness_per_query.
            ttl: 12h


# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# The memcached chunk cache stays off - the in-process one configured above
# under loki.structuredConfig replaces it.
chunksCache:
  enabled: false

# Both caches now live in loki's own heap, see loki.structuredConfig above, so
# this chart's memcached is off. It defaults to enabled, which is why the
# cluster has been running a loki-results-cache pod all along while the values
# here claimed the opposite.
#
# What that pod bought was a cache that outlives loki: memcached keeps its
# entries across a restart of the single binary, and an in-process cache does
# not - the first queries after every helmfile apply are uncached now. What it
# cost was 614Mi reserved on the one node, a network hop on every lookup and
# another image in the upgrade chain. For one binary, one tenant and a handful
# of dashboards that trade is not worth a pod.
#
# Watching it changes with it: memcached_current_bytes and
# memcached_items_evicted_total are gone, loki_cache_hits and
# loki_embeddedcache_entries - both labelled by cache name - say the same
# things from loki itself.
resultsCache:
  enabled: false
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# One replica, a required podAntiAffinity on kubernetes.io/hostname from the
# chart, and one node. The default RollingUpdate then deadlocks on every
# upgrade: it starts the new pod before draining the old one, the old pod's own
# anti-affinity rule keeps the new one off the only node, and helm still
# reports the release upgraded while the gateway quietly keeps serving the
# previous version. Deleting the pod by hand does not help either - the old
# ReplicaSet is still scaled to 1 and simply wins the race again.
#
# maxSurge 0 with maxUnavailable 1 drains the old pod before starting the new
# one, which is what ends the deadlock. It costs a few seconds of gateway
# downtime on a single node. The anti-affinity is left alone so it still
# spreads the gateway if the cluster ever grows a second node.
#
# Not type: Recreate, which looks like the obvious answer and cannot be applied
# to a Deployment that already exists: helm's server-side apply merges, the
# spec.strategy.rollingUpdate block of the running object survives, and the API
# rejects it - "may not be specified when strategy type is 'Recreate'".
gateway:
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
