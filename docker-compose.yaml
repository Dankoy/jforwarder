volumes:
  kafka_volume:
    driver: local
  subscriptions_holder_postgres_volume:
    driver: local
  telegram_chat_service_postgres_volume:
    driver: local
  kafka_ui_proto_volume:
    driver: local

networks:
  jforwarder-network:
    name: jforwarder-network
    external: true
